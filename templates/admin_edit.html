<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Registro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container mt-5">
        <div class="card shadow-lg">
            <div class="card-header bg-primary text-white">
                <h3 class="mb-0">Editar Registro</h3>
            </div>

            <div class="card-body">

                <!-- Mostrar mensajes flash -->
                {% with messages = get_flashed_messages() %}
                    {% if messages %}
                        <div class="alert alert-info">
                            {% for msg in messages %}
                                {{ msg }}<br>
                            {% endfor %}
                        </div>
                    {% endif %}
                {% endwith %}

                <form action="{{ url_for('admin_edit', tabla=tabla, id=id) }}" method="POST">

                    {% for campo, valor in datos.items() %}
                        {% if campo != 'id' %} 
                            <div class="mb-3">
                                <label class="form-label text-capitalize">{{ campo.replace('_',' ') }}</label>
                                <input type="text" name="{{ campo }}" value="{{ valor }}" class="form-control" required>
                            </div>
                        {% endif %}
                    {% endfor %}

                    <div class="d-flex justify-content-between mt-4">
                        <a href="{{ url_for('admin', tabla=tabla) }}" class="btn btn-secondary">
                            Regresar
                        </a>

                        <button type="submit" class="btn btn-success">
                            Guardar Cambios
                        </button>
                    </div>

                </form>
            </div>
        </div>
    </div>

</body>
</html>
