<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel de Módulos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1>Hola {{ session.estudiante_nombre }}! Aqui estan tus módulos disponibles</h1>
        <a href="{{ url_for('logout') }}" class="btn btn-danger mb-3">Cerrar sesión</a>
        <div class="row">
            {% for modulo in modulos %}
            <div class="col-md-4 mb-3">
                <div class="card {% if not modulo.desbloqueado %}bg-light text-muted{% else %}bg-white{% endif %}">
                    <div class="card-body">
                        <h5 class="card-title">{{ modulo.titulo }}</h5>
                        {% if modulo.desbloqueado %}
                            <a href="{{ url_for('ver_modulo', modulo_id=modulo.id) }}" class="btn btn-primary">Ingresar</a>
                        {% else %}
                            <button class="btn btn-secondary" disabled>Bloqueado</button>
                        {% endif %}
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
